name: Cypress test
# The application under test is the real deployable image: built with the same
# bake target as .github/workflows/build-next.yml (same Dockerfile, same
# Turborepo remote cache, same registry layer cache) and then started with
# `docker run`. Only NEXT_BUILD_ENV differs -- `e2e` bakes
# next/.env.ci-build.e2e, which disables the captcha and points cookies at
# localhost. The image is loaded into the local Docker store, never pushed.

on:
  pull_request:
    branches:
      - master

  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: harbor.bratislava.sk
  REGISTRY_USERNAME: robot$github_actions
  # Root definitions (targets and the pinned build args) plus the CI overlay
  # that adds registry cache, tags and the Turborepo remote cache.
  BAKE_FILES: |
    docker-bake.json
    docker-bake.hcl
    .github/docker-bake.ci.hcl
  # Local-only tag; the e2e image is never pushed.
  IMAGE_TAG: city-account-next:e2e
  CONTAINER_NAME: city-account-next-e2e

jobs:
  dependabot-approval:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependabot
    steps:
      - name: Wait for approval
        run: echo "Approved to run Cypress tests for Dependabot PR"

  cypress-tests:
    needs: [ dependabot-approval ]
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped')
    runs-on: bratislava
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker build
        uses: bratislava/github-actions/.github/actions/setup-docker-build@beta
        with:
          docker_registry_username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          docker_registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          harbor_registry: ${{ env.REGISTRY }}
          harbor_registry_username: ${{ env.REGISTRY_USERNAME }}
          harbor_registry_password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          # Put BuildKit itself in the runner's network namespace so that a
          # build step with `network = "host"` can reach the Turborepo cache
          # server on plain localhost. Without this the builder runs on the
          # bridge network and "host" only means the builder's own namespace.
          buildx_driver_opts: |
            network=host

      # Registry layer cache only -- the `-e2e` flavor keeps it separate from
      # the deployable images, whose builds bake a different environment.
      - name: Docker metadata
        id: meta
        uses: bratislava/github-actions/.github/actions/docker-metadata@beta
        with:
          image: ${{ env.REGISTRY }}/standalone/next
          suffix: -e2e

      - name: Set up Turborepo cache
        id: turbo-cache
        uses: ./.github/actions/setup-turborepo-cache
        with:
          minio_secret_key: ${{ secrets.TURBOREPO_CACHE_MINIO_SECRET_KEY }}

      - name: Build application image
        uses: docker/bake-action@v7
        with:
          files: ${{ env.BAKE_FILES }}
          targets: next
          # Not pushed; the image has to reach the local Docker store so the
          # next step can run it.
          load: true
          # The bake target sets network=host, which is a gated entitlement.
          allow: network.host
        env:
          CACHE_FROM: ${{ steps.meta.outputs.cache_from }}
          CACHE_TO: ${{ steps.meta.outputs.cache_to }}
          TAGS: ${{ env.IMAGE_TAG }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}
          NEXT_BUILD_ENV: e2e

      - name: Start application container
        run: |
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 3000:3000 \
            "$IMAGE_TAG"

      # Cypress and its browser only; the application is not built here.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Use pnpm and install dependencies
        uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: |
            - args:
                - --frozen-lockfile
                - --filter=konto-bratislava-sk-monorepo
                - --filter=city-account-cypress-tests

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: pnpm --filter city-account-cypress-tests run cypress:ci

      - name: Application logs
        if: always()
        run: docker logs "$CONTAINER_NAME"

      - name: Stop application container
        if: always()
        run: docker rm --force "$CONTAINER_NAME"

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: tests/cypress/screenshots
          retention-days: 1

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: tests/cypress/videos
          retention-days: 1

      - name: Visual testing screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-testing
          path: tests/cypress/visualTesting
          retention-days: 1
