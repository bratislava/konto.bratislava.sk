name: Playwright test

on:
  pull_request:
    branches:
      - master

  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: harbor.bratislava.sk
  REGISTRY_USERNAME: robot$github_actions
  BAKE_FILES: |
    docker-bake.json
    docker-bake.hcl
    .github/docker-bake.ci.hcl
  IMAGE_TAG: city-account-next:e2e
  CONTAINER_NAME: city-account-next-e2e-playwright
  REPORT_DIR: reports/${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  dependabot-approval:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependabot
    steps:
      - name: Wait for approval
        run: echo "Approved to run Playwright tests for Dependabot PR"

  playwright-tests:
    needs: [ dependabot-approval ]
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Needed to push the HTML report to the `gh-pages` branch.
    permissions:
      contents: write

    outputs:
      report_url: ${{ steps.report-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        id: node
        background: true
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Set up Docker build
        id: docker-build-setup
        background: true
        uses: bratislava/github-actions/.github/actions/setup-docker-build@beta
        with:
          docker_registry_username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          docker_registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          harbor_registry: ${{ env.REGISTRY }}
          harbor_registry_username: ${{ env.REGISTRY_USERNAME }}
          harbor_registry_password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          buildx_driver_opts: |
            network=host

      # Same `-e2e` suffix as the Cypress workflow on purpose: both build the identical
      # NEXT_BUILD_ENV=e2e image, so they share the Docker layer cache.
      - name: Docker metadata
        id: meta
        background: true
        uses: bratislava/github-actions/.github/actions/docker-metadata@beta
        with:
          image: ${{ env.REGISTRY }}/standalone/next
          suffix: -e2e

      - name: Set up Turborepo cache
        id: turbo-cache
        background: true
        uses: ./.github/actions/setup-turborepo-cache
        with:
          minio_secret_key: ${{ secrets.TURBOREPO_CACHE_MINIO_SECRET_KEY }}

      - name: Wait for Node.js
        wait: node

      # The trailing `...` pulls in workspace dependencies, which the Playwright package needs:
      # unlike the Cypress suite it imports `forms-shared` through its `exports` map rather than
      # reaching into `forms-shared/src` with a relative require.
      - name: Use pnpm and install dependencies
        id: install-deps
        background: true
        uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: |
            - args:
                - --frozen-lockfile
                - --filter=konto-bratislava-sk-monorepo
                - --filter=city-account-playwright-tests...

      - name: Wait for Docker and Turborepo cache setup
        wait: [ docker-build-setup, meta, turbo-cache ]

      - name: Build application image
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: next
          load: true
          allow: network.host
        env:
          CACHE_FROM: ${{ steps.meta.outputs.cache_from }}
          CACHE_TO: ${{ steps.meta.outputs.cache_to }}
          TAGS: ${{ env.IMAGE_TAG }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}
          NEXT_BUILD_ENV: e2e

      - name: Start application container
        run: |
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 3000:3000 \
            "$IMAGE_TAG"

      - name: Wait for dependency install
        wait: install-deps

      # The suite imports `forms-shared/summary-json/...` and `forms-shared/example-forms/...`,
      # which resolve to `dist` through the package's `exports` map, so it has to be compiled.
      - name: Build forms-shared
        run: pnpm --filter forms-shared run build

      - name: Install Playwright browsers
        run: pnpm --filter city-account-playwright-tests exec playwright install --with-deps chromium

      - name: Wait for application
        run: |
          timeout 120 bash -c \
            'until curl --silent --fail --output /dev/null http://localhost:3000/api/healthcheck; do sleep 2; done'

      - name: Run Playwright tests
        run: pnpm --filter city-account-playwright-tests run test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        background: true
        with:
          name: playwright-report
          path: tests-playwright/playwright-report
          retention-days: 1

      # Traces, videos and screenshots for failed tests.
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        background: true
        with:
          name: playwright-test-results
          path: tests-playwright/test-results/index.html
          archive: false
          retention-days: 1

      - name: Upload JUnit results
        uses: actions/upload-artifact@v7
        if: always()
        background: true
        with:
          name: playwright-junit
          path: tests-playwright/results
          retention-days: 1

      # The `html` reporter in `playwright.config.ts` already wrote the report, so this only
      # publishes it. Every run gets its own directory and `keep_files` leaves the existing ones
      # alone, so links from earlier runs keep working.
      #
      # Skipped for fork and Dependabot pull requests: those get a read-only `GITHUB_TOKEN`, so the
      # push to `gh-pages` would fail. The `playwright-report` artifact above still covers them.
      - name: Publish Playwright report to GitHub Pages
        id: publish-report
        if: >-
          always()
          && hashFiles('tests-playwright/playwright-report/**') != ''
          && github.event.pull_request.head.repo.fork != true
          && github.actor != 'dependabot[bot]'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests-playwright/playwright-report
          destination_dir: ${{ env.REPORT_DIR }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Playwright report for ${{ github.sha }} (run ${{ github.run_id }})"

      - name: Output report URL
        id: report-url
        if: always() && steps.publish-report.outcome == 'success'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          url="https://${OWNER,,}.github.io/${REPO#*/}/${REPORT_DIR}/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Playwright report: $url"
          {
            echo "### Playwright report"
            echo
            echo "<$url>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Application logs
        if: always()
        continue-on-error: true
        run: docker logs "$CONTAINER_NAME"

      - name: Stop application container
        if: always()
        continue-on-error: true
        run: docker rm --force "$CONTAINER_NAME"

      - name: Wait for uploads
        wait-all:
