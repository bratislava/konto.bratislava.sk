packages:
  - forms-shared
  - nest-city-account
  - nest-clamav-scanner
  - nest-forms-backend
  - nest-tax-backend
  - openapi-cli
  - openapi-clients
  - next
  - scripts
  - strapi
  - tests
# `ssh2` (via `ssh2-sftp-client` in nest-tax-backend) compiles two optional
# native speedups — its own `sshcrypto` binding and `cpu-features`. Neither
# builds in the alpine images (no python3/g++) and both are `require`d inside a
# try/catch, so ssh2 silently falls back to Node's `crypto`. Skipping the builds
# keeps the images free of a compiler toolchain and makes local, CI and Docker
# installs behave the same.
allowBuilds:
  '@apollo/protobufjs': true
  '@openapitools/openapi-generator-cli': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js-pure: true
  cpu-features: false
  cypress: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@bratislava/*'
