  toolchain-versions:
    name: Verify toolchain versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Verify toolchain versions
        run: node ./scripts/verify-toolchain-versions.mjs
