version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/forms-shared'
      - '/nest-city-account'
      - '/nest-clamav-scanner'
      - '/nest-forms-backend'
      - '/nest-tax-backend'
      - '/openapi-clients'
    versioning-strategy: increase
    schedule:
      interval: 'weekly'
      day: 'sunday'
    # pnpm rejects versions published too recently (minimumReleaseAge), so a bump
    # of a fresh release would fail to install. Our own packages are exempt there
    # too.
    cooldown:
      default-days: 3
      exclude:
        - '@bratislava/*'
    ignore:
      # RJSF and Ajv packages must be updated manually and thoroughly checked if they work
      # These packages must be updated synchronously across all packages
      - dependency-name: '@rjsf/*'
      - dependency-name: 'ajv'
      - dependency-name: 'ajv-*'
      # `pnpm run generate-assets` must be executed after Tailwind update
      - dependency-name: '@tailwindcss/postcss'
      - dependency-name: 'tailwindcss'
      - dependency-name: 'postcss'
      # Playwright must be updated together with PLAYWRIGHT_VERSION in docker-bake.json
      - dependency-name: 'playwright'
      - dependency-name: '@playwright/test'
      # Turbo must be updated together with TURBO_VERSION in docker-bake.json
      - dependency-name: 'turbo'
      # Major version updates of Node types are done manually when Node version is upgraded
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      nestjs-dependencies:
        patterns:
          - '@nestjs/*'
          - '@nestjs-*'
      prisma-dependencies:
        patterns:
          - 'prisma'
          - 'prisma-*'
          - '@prisma/*'
      aws-dependencies:
        patterns:
          - '@aws-sdk/*'
          - 'aws-jwt-verify'
      eslint-dependencies:
        patterns:
          - 'eslint'
          - '@bratislava/eslint-config-nest'
      react-email-dependencies:
        patterns:
          - 'react-email'
          - '@react-email/*'

  # Open only security updates https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#open-pull-requests-limit
  - package-ecosystem: 'npm'
    directory: '/next'
    versioning-strategy: increase
    schedule:
      interval: 'weekly'
      day: 'sunday'
    open-pull-requests-limit: 0
    ignore:
      # Major version updates of Node types are done manually when Node version is upgraded
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
