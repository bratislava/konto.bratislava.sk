name: OpenAPI ChatOps
# Regenerates a service's committed OpenAPI spec from a pull request comment:
#
#   /openapi nest-forms-backend
#
# The spec is built by the same Docker stage machinery as the rest of CI --
# `<service>-openapi-generate` in docker-bake.hcl -- rather than by running the
# toolchain on the runner, so what gets committed is produced exactly the way
# the `<service>-openapi` validation stage will later check it.
#
# Two things worth knowing before relying on this:
#
#   - `issue_comment` workflows always run the copy of this file on the default
#     branch, never the one on the pull request branch. Editing it in a pull
#     request has no effect until that pull request merges.
#   - Commits pushed with GITHUB_TOKEN do not trigger workflows, so the pull
#     request's checks do not re-run on their own. The result comment says so.
on:
  issue_comment:
    types: [created]

# Never let two regenerations of the same pull request race for the branch.
concurrency:
  group: openapi-chatops-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  regenerate:
    name: Regenerate OpenAPI spec
    # Cheap pre-filter, before anything occupies a self-hosted runner. Whether
    # the comment may actually run the command is github/command's decision,
    # below.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/openapi')
    runs-on: bratislava
    env:
      REGISTRY: harbor.bratislava.sk
      REGISTRY_USERNAME: robot$github_actions
      BAKE_FILES: |
        docker-bake.json
        docker-bake.hcl
        .github/docker-bake.ci.hcl
      # Matches `output = ["type=local,dest=…"]` on `_openapi-generate`.
      OUTPUT_DIR: .openapi-generated
    steps:
      # Checks the author's permissions, resolves the pull request's ref and
      # sha, reacts to the comment, and reacts again with the outcome once the
      # job finishes.
      - name: Parse the command
        id: command
        uses: github/command@v2
        with:
          command: /openapi
          # Default is `|`, which would make the command `/openapi | forms`.
          param_separator: " "
          allowed_contexts: pull_request
          # The whole point of the command is to fix a spec check that is
          # currently failing, so a red pull request is the normal case for
          # running it -- and waiting for an approving review to fix a
          # generated file would be backwards.
          skip_ci: "true"
          skip_reviews: "true"

      # Everything below is `if: success()` by default, so failing here is what
      # stops a comment the Action rejected. It has already reacted to explain
      # why.
      - name: Stop unless the command was accepted
        if: steps.command.outputs.continue != 'true'
        run: exit 1

      # GITHUB_TOKEN cannot write to a fork's branch, and with reviews skipped
      # above, building unreviewed fork code on a self-hosted runner is not
      # something to do quietly either.
      - name: Refuse forks
        if: steps.command.outputs.fork == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            `/openapi` cannot write to a fork's branch. Regenerate locally with
            `pnpm --filter <service> run openapi` and push.

      - name: Fail on fork
        if: steps.command.outputs.fork == 'true'
        run: exit 1

      # Accepts the workspace directory name -- the same identifier build.yml
      # passes to build-nest.yml -- plus the spec's own name as a shorthand, so
      # `/openapi forms` and `/openapi nest-forms-backend` both work.
      - name: Resolve service
        id: service
        # Through the environment, not interpolated into the script: the
        # parameter is comment text, and `${{ }}` would splice it in as shell
        # source.
        env:
          PARAMS: ${{ steps.command.outputs.params }}
        run: |
          set -euo pipefail
          case "${PARAMS}" in
            nest-forms-backend|forms)                  service=nest-forms-backend ;;
            nest-tax-backend|tax)                      service=nest-tax-backend ;;
            nest-city-account|city-account)            service=nest-city-account ;;
            nest-clamav-scanner|clamav-scanner|clamav) service=nest-clamav-scanner ;;
            *)                                         service="" ;;
          esac
          echo "name=${service}" >> "$GITHUB_OUTPUT"

      - name: Explain an unknown service
        if: steps.service.outputs.name == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Unknown service. Usage: `/openapi <service>`, where `<service>` is a
            backend's workspace directory (`nest-forms-backend`) or its spec name
            (`forms`).

      - name: Fail on unknown service
        if: steps.service.outputs.name == ''
        run: exit 1

      # By branch name rather than by the command's sha: the commit action
      # pushes `HEAD:<branch>`, and from a detached head there would be no
      # branch to fast-forward. If someone pushes in the meantime the push is
      # rejected, which is the right way for that race to end.
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.command.outputs.ref }}
          fetch-depth: 1

      - name: Set up Docker build
        uses: bratislava/github-actions/.github/actions/setup-docker-build@beta
        with:
          docker_registry_username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          docker_registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          harbor_registry: ${{ env.REGISTRY }}
          harbor_registry_username: ${{ env.REGISTRY_USERNAME }}
          harbor_registry_password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          # Same reason as in build-nest.yml: the bake targets build with
          # `network = "host"`, which only reaches the Turborepo cache server on
          # localhost when BuildKit itself is in the runner's namespace.
          buildx_driver_opts: |
            network=host

      # Read-only: the generate stage shares its `builder-deps` base with the
      # validation stage, so CI's cache warms this build, but a one-off
      # regeneration has no business writing back to it.
      - name: Docker metadata (openapi)
        id: meta-openapi
        uses: bratislava/github-actions/.github/actions/docker-metadata@beta
        with:
          image: harbor.bratislava.sk/standalone/${{ steps.service.outputs.name }}
          suffix: -openapi

      - name: Set up Turborepo cache
        id: turbo-cache
        uses: ./.github/actions/setup-turborepo-cache
        with:
          minio_secret_key: ${{ secrets.TURBOREPO_CACHE_MINIO_SECRET_KEY }}

      - name: Generate OpenAPI spec
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ steps.service.outputs.name }}-openapi-generate
          allow: network.host
        env:
          CACHE_FROM: ${{ steps.meta-openapi.outputs.cache_from }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}

      # The stage exports exactly one file, so this cannot pick up a spec the
      # command did not ask for -- and the glob failing is a real error.
      - name: Move the spec into place
        id: spec
        run: |
          set -euo pipefail
          shopt -s failglob
          spec=("${OUTPUT_DIR}"/*.json)
          if [ "${#spec[@]}" -ne 1 ]; then
            echo "Expected one spec in ${OUTPUT_DIR}, got: ${spec[*]}" >&2
            exit 1
          fi
          mv "${spec[0]}" openapi-specs/
          rm -rf "${OUTPUT_DIR}"
          echo "file=openapi-specs/$(basename "${spec[0]}")" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ steps.command.outputs.ref }}
          file_pattern: ${{ steps.spec.outputs.file }}
          commit_message: >-
            chore: regenerate ${{ steps.spec.outputs.file }}
            for ${{ steps.service.outputs.name }}

      - name: Report the result
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            ${{ steps.commit.outputs.changes_detected == 'true'
              && format('Regenerated `{0}` from `{1}` and pushed it to this branch. Checks do not re-run automatically on a bot push — re-run them from the checks tab.', steps.spec.outputs.file, steps.service.outputs.name)
              || format('`{0}` is already up to date with `{1}`. Nothing to commit.', steps.spec.outputs.file, steps.service.outputs.name) }}

      # The rejection paths comment for themselves; this covers a build that
      # actually broke, which would otherwise only show up in the run log.
      - name: Report a failed build
        if: failure() && steps.service.outputs.name != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: >-
            Regenerating the `${{ steps.service.outputs.name }}` spec failed.
            [See the run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
