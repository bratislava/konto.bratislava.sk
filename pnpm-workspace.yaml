# `ssh2` (via `ssh2-sftp-client` in nest-tax-backend) compiles two optional
# native speedups — its own `sshcrypto` binding and `cpu-features`. Neither
# builds in the alpine images (no python3/g++) and both are `require`d inside a
# try/catch, so ssh2 silently falls back to Node's `crypto`. Skipping the builds
# keeps the images free of a compiler toolchain and makes local, CI and Docker
# installs behave the same.
allowBuilds:
  '@apollo/protobufjs': true
  '@openapitools/openapi-generator-cli': true
  # Pulled in by jest-haste-map 30.5. Its install script only compiles when a
  # source build is forced; the prebuilt binary comes from a per-platform
  # optional dependency.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js-pure: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@bratislava/*'
  # Temporary, remove after 2026-09-26: @nestjs-cognito/auth 2.6.0 (with its
  # @nestjs-cognito/core 2.5.0) is the first release that accepts NestJS 12 and
  # was published on 2026-09-25, inside the default one-day release age window.
  - '@nestjs-cognito/*'

# @golevelup/nestjs-rabbitmq 9.0.2 and its @golevelup/nestjs-discovery still cap
# their NestJS peers at v11. They run on NestJS 12 unchanged: the only Nest
# internals they import (`@nestjs/common/constants`,
# `@nestjs/core/helpers/external-context-creator`) resolve through Nest 12's
# `./*` export. Support is pending upstream in
# https://github.com/golevelup/nestjs/pull/1262; drop these rules once a release
# widens the peer range.
peerDependencyRules:
  allowedVersions:
    '@golevelup/nestjs-rabbitmq>@nestjs/common': '12'
    '@golevelup/nestjs-rabbitmq>@nestjs/core': '12'
    '@golevelup/nestjs-discovery>@nestjs/common': '12'
    '@golevelup/nestjs-discovery>@nestjs/core': '12'

# The root package.json pins Node and pnpm in devEngines with `onFail: error`,
# so any tool that reads that contract and finds the wrong version stops instead
# of running on a mismatch. That is the right default for a consumer that only
# checks the pin.
#
# When the toolchain is used through pnpm, though, the versions are managed by
# pnpm, so the two settings below relax that `error` to `download` for pnpm's own
# runs: when pnpm -- or a Node process pnpm starts -- needs a version that is not
# present, pnpm fetches the pinned one and uses it. Direct `node` stays Volta's
# job (volta.node), and a bare non-pnpm tool still hits the strict error.
#
# pmOnFail overrides devEngines.packageManager.onFail; runtimeOnFail overrides
# devEngines.runtime.onFail.
pmOnFail: download
runtimeOnFail: download
