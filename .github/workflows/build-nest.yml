name: Build Nest
# Two modes, selected by the `cluster` input:
#   - CI (cluster == ''): build the validation/test/lint[/e2e] images and the
#     final `runner` image, do not push.
#   - Deploy (cluster != ''): reuse an existing commit image or build+push the
#     `runner` image and re-tag it for the cluster. Pass skip_tests: true to skip
#     the test images. The infrastructure deploy is triggered separately by the
#     caller (deploy.yml).
#
# Backend images are environment-agnostic, so the commit image (no flavor
# suffix) is reused across clusters.
on:
  workflow_call:
    inputs:
      service:
        description: >-
          Workspace directory name of the service, which is also its bake target
          name (see docker-bake.hcl). Stage targets are `<service>-<stage>`.
        type: string
        required: true
      image:
        description: "Full image name including registry/repository for Docker cache."
        type: string
        required: true
      e2e_tests:
        description: "Run the E2E test image build (requires a `test-e2e` Docker target)."
        type: boolean
        required: false
        default: false
      skip_tests:
        description: "Skip the validation/test/lint/e2e images (used in deploy mode)."
        type: boolean
        required: false
        default: false
      cluster:
        description: >-
          Target cluster (development, staging, production). Empty = CI build
          only (no push). When set, the deployable image is built/pushed and
          re-tagged for the cluster, ready for the caller to trigger the
          infrastructure deploy.
        type: string
        required: false
        default: ""
    secrets:
      DOCKER_REGISTRY_USERNAME:
        required: true
      DOCKER_REGISTRY_PASSWORD:
        required: true
      HARBOR_REGISTRY_PASSWORD:
        required: true
      TURBOREPO_CACHE_MINIO_SECRET_KEY:
        required: true

permissions:
  contents: read

env:
  REGISTRY: harbor.bratislava.sk
  REGISTRY_USERNAME: robot$github_actions
  BAKE_FILES: |
    docker-bake.json
    docker-bake.hcl
    .github/docker-bake.ci.hcl

jobs:
  test:
    name: Build Nest
    runs-on: bratislava
    env:
      # Per-cluster deploy tag prefix (empty in CI).
      CLUSTER_PREFIX: ${{ inputs.cluster != '' && format('{0}-', inputs.cluster) || '' }}
    services:
      postgres:
        # GitHub Actions does not support `if:` on services, so use an empty image
        # to disable the service when E2E tests are not running.
        image: ${{ inputs.e2e_tests && !inputs.skip_tests && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: forms
          POSTGRES_USER: forms
          POSTGRES_PASSWORD: password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U forms -d forms"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker build
        uses: bratislava/github-actions/.github/actions/setup-docker-build@beta
        with:
          docker_registry_username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          docker_registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          harbor_registry: ${{ env.REGISTRY }}
          harbor_registry_username: ${{ env.REGISTRY_USERNAME }}
          harbor_registry_password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          # Put BuildKit itself in the runner's network namespace so that a
          # build step with `network = "host"` can reach the Turborepo cache
          # server and the E2E postgres service container on plain localhost.
          # Without this the builder runs on the bridge network and "host" only
          # means the builder's own namespace.
          buildx_driver_opts: |
            network=host

      - name: Docker build config
        id: config
        uses: ./.github/actions/docker-build-config
        with:
          image: ${{ inputs.image }}
          prefix: ${{ env.CLUSTER_PREFIX }}
          caches: builder-deps,test,lint,test-e2e
          push: ${{ inputs.cluster != '' }}

      - name: Set up Turborepo cache
        id: turbo-cache
        uses: ./.github/actions/setup-turborepo-cache
        with:
          minio_secret_key: ${{ secrets.TURBOREPO_CACHE_MINIO_SECRET_KEY }}

      # Every bake target below sets network=host, which is a gated entitlement,
      # hence `allow: network.host` on each step.
      - name: Build validation image
        if: ${{ !inputs.skip_tests }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ inputs.service }}-builder-deps
          allow: network.host
        env:
          CACHE_FROM: ${{ fromJSON(steps.config.outputs.cache)['builder-deps'].from }}
          CACHE_TO: ${{ fromJSON(steps.config.outputs.cache)['builder-deps'].to }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}

      - name: Run unit tests
        if: ${{ !inputs.skip_tests }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ inputs.service }}-test
          allow: network.host
        env:
          CACHE_FROM: ${{ fromJSON(steps.config.outputs.cache).test.from }}
          CACHE_TO: ${{ fromJSON(steps.config.outputs.cache).test.to }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}

      - name: Run ESLint
        if: ${{ !inputs.skip_tests }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ inputs.service }}-lint
          allow: network.host
        env:
          CACHE_FROM: ${{ fromJSON(steps.config.outputs.cache).lint.from }}
          CACHE_TO: ${{ fromJSON(steps.config.outputs.cache).lint.to }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}

      - name: Run E2E tests
        if: ${{ !inputs.skip_tests && inputs.e2e_tests }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ inputs.service }}-test-e2e
          allow: network.host
          set: |
            *.args.CI_E2E_DATABASE_URL=postgresql://forms:password@localhost:${{ job.services.postgres.ports['5432'] }}/forms?schema=public&connect_timeout=30
        env:
          CACHE_FROM: ${{ fromJSON(steps.config.outputs.cache)['test-e2e'].from }}
          CACHE_TO: ${{ fromJSON(steps.config.outputs.cache)['test-e2e'].to }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}

      # CI mode: build the final `runner` image, do not push.
      - name: Build final image
        if: ${{ inputs.cluster == '' }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ inputs.service }}
          allow: network.host
        env:
          CACHE_FROM: ${{ fromJSON(steps.config.outputs.cache).main.from }}
          CACHE_TO: ${{ fromJSON(steps.config.outputs.cache).main.to }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}

      # Deploy mode only: reuse the commit image across clusters. If it already
      # exists, re-tag it for this cluster and skip the build below.
      - name: Check for existing image
        if: ${{ inputs.cluster != '' }}
        id: existing
        uses: bratislava/github-actions/.github/actions/check-existing-image@beta
        with:
          existing_tag: ${{ inputs.image }}:${{ steps.sha.outputs.short_sha }}
          new_tag: ${{ inputs.image }}:${{ env.CLUSTER_PREFIX }}${{ steps.sha.outputs.short_sha }}

      # Deploy mode: build+push the deployable image when not reused.
      - name: Build deploy image
        if: ${{ inputs.cluster != '' && steps.existing.outputs.found != 'true' }}
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: ${{ inputs.service }}
          allow: network.host
        env:
          CACHE_FROM: ${{ fromJSON(steps.config.outputs.cache).main.from }}
          CACHE_TO: ${{ fromJSON(steps.config.outputs.cache).main.to }}
          TAGS: ${{ join(fromJSON(steps.config.outputs.meta).tags, ' ') }}
          OUTPUT: ${{ steps.config.outputs.image_output }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}
