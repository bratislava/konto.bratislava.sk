name: Validate Repository

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-versions:
    name: Verify versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          # pnpm/setup can only run a bare `pnpm install`; this repository wants
          # a frozen, filtered one, so it is a step of its own below.
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=repository-scripts

      - name: Typecheck scripts
        run: pnpm --filter=repository-scripts run typecheck

      - name: Verify toolchain versions
        run: node ./scripts/verify-toolchain-versions.ts

      - name: Verify exact package versions
        run: node ./scripts/verify-exact-package-versions.ts

      - name: Verify Docker build args
        run: node ./scripts/verify-docker-bake-versions.ts
