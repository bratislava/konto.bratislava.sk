name: E2E tests

on:
  pull_request:
    branches:
      - master

  push:
    tags:
      - "dev**"
      - "staging**"
      - "prod**"
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: harbor.bratislava.sk
  REGISTRY_USERNAME: robot$github_actions
  BAKE_FILES: |
    docker-bake.json
    docker-bake.hcl
    .github/docker-bake.ci.hcl
  IMAGE_TAG: city-account-next:e2e
  CONTAINER_NAME: city-account-next-e2e
  E2E_PACKAGE: city-account-e2e-tests

jobs:
  dependabot-approval:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependabot
    steps:
      - name: Wait for approval
        run: echo "Approved to run E2E tests for Dependabot PR"

  e2e-tests:
    needs: [ dependabot-approval ]
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        id: pnpm-setup
        background: true
        uses: pnpm/setup@v2
        with:
          cache: true
          # pnpm/setup can only run a bare `pnpm install`; the filtered, frozen
          # one this job needs stays a backgrounded step of its own below, so it
          # keeps overlapping the image build.
          install: false

      - name: Set up Docker build
        id: docker-build-setup
        background: true
        uses: bratislava/github-actions/.github/actions/setup-docker-build@beta
        with:
          docker_registry_username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          docker_registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          harbor_registry: ${{ env.REGISTRY }}
          harbor_registry_username: ${{ env.REGISTRY_USERNAME }}
          harbor_registry_password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          buildx_driver_opts: |
            network=host

      - name: Docker metadata
        id: meta
        background: true
        uses: bratislava/github-actions/.github/actions/docker-metadata@beta
        with:
          image: ${{ env.REGISTRY }}/standalone/next
          suffix: -e2e

      - name: Set up Turborepo cache
        id: turbo-cache
        background: true
        uses: ./.github/actions/setup-turborepo-cache
        with:
          minio_secret_key: ${{ secrets.TURBOREPO_CACHE_MINIO_SECRET_KEY }}

      - name: Wait for pnpm and Node.js
        wait: pnpm-setup

      # The trailing `...` pulls in the workspace dependencies, which the suite
      # needs: unlike the Cypress suite it imports `forms-shared` through its
      # `exports` map, so the package has to be installed and built.
      - name: Install dependencies
        id: install-deps
        background: true
        run: pnpm install --frozen-lockfile --filter=konto-bratislava-sk-monorepo --filter="${E2E_PACKAGE}..."

      - name: Wait for Docker and Turborepo cache setup
        wait: [ docker-build-setup, meta, turbo-cache ]

      - name: Build application image
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ env.BAKE_FILES }}
          targets: next
          load: true
          allow: network.host
        env:
          CACHE_FROM: ${{ steps.meta.outputs.cache_from }}
          CACHE_TO: ${{ steps.meta.outputs.cache_to }}
          TAGS: ${{ env.IMAGE_TAG }}
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}
          NEXT_BUILD_ENV: e2e

      - name: Start application container
        run: |
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 3000:3000 \
            "$IMAGE_TAG"

      - name: Wait for dependency install
        wait: install-deps

      - name: Install Playwright browsers
        id: playwright-browsers
        background: true
        run: pnpm --filter "$E2E_PACKAGE" exec playwright install --with-deps chromium

      # The suite imports `forms-shared/example-forms/...`, which resolve to
      # `dist` through the package's `exports` map, so it has to be compiled.
      # Same Turborepo remote cache as the image build, so an unchanged package
      # is restored rather than rebuilt.
      - name: Build test dependencies
        id: test-deps
        background: true
        run: pnpm --filter "$E2E_PACKAGE" run build:dependencies
        env:
          TURBO_API: ${{ steps.turbo-cache.outputs.turbo_api }}
          TURBO_TEAM: city-account
          TURBO_TOKEN: local

      # `playwright.config.ts` declares a `webServer` with `reuseExistingServer`,
      # so it adopts the container started above rather than launching an app
      # of its own.
      - name: Wait for application
        run: |
          timeout 120 bash -c \
            'until curl --silent --fail --output /dev/null http://localhost:3000/api/healthcheck; do sleep 2; done'

      - name: Wait for the test prerequisites
        wait: [ playwright-browsers, test-deps ]

      - name: Run Playwright tests
        run: pnpm --filter "$E2E_PACKAGE" run test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        background: true
        with:
          name: playwright-report
          path: e2e-tests/playwright-report
          retention-days: 1

      # Traces, videos and screenshots for failed tests.
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: always()
        background: true
        with:
          name: playwright-test-results
          path: e2e-tests/test-results
          retention-days: 1

      - name: Upload JUnit results
        uses: actions/upload-artifact@v7
        if: always()
        background: true
        with:
          name: playwright-junit
          path: e2e-tests/results
          retention-days: 1

      - name: Application logs
        if: always()
        continue-on-error: true
        run: docker logs "$CONTAINER_NAME"

      - name: Stop application container
        if: always()
        continue-on-error: true
        run: docker rm --force "$CONTAINER_NAME"

      - name: Wait for uploads
        wait-all:
