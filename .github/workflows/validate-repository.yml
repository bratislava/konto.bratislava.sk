name: Validate Repository

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-versions:
    name: Verify versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Use pnpm and install dependencies
        uses: pnpm/action-setup@v6
        with:
          cache: true
          run_install: |
            - args:
                - --frozen-lockfile
                - --filter=repository-scripts

      - name: Typecheck scripts
        run: pnpm --filter=repository-scripts run typecheck

      - name: Verify toolchain versions
        run: node ./scripts/verify-toolchain-versions.ts

      - name: Verify exact package versions
        run: node ./scripts/verify-exact-package-versions.ts

      - name: Verify Docker build args
        run: node ./scripts/verify-docker-bake-versions.ts
