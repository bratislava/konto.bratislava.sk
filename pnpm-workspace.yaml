  '@react-stately/utils': 3.12.1
  '@react-types/shared': 3.36.0
  '@rjsf/core': 6.5.2
  '@rjsf/utils': 6.5.2
  '@rjsf/validator-ajv8': 6.5.2
  '@types/node': 24.13.3
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  ajv: 8.20.0
  ajv-errors: 3.0.0
  ajv-formats: 3.0.1
  axios: 1.18.1
  playwright: 1.59.1
  react: 19.2.6
  react-aria: 3.50.0
  react-aria-components: 1.19.0
