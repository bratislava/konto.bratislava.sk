packages:
  - e2e-tests
  - forms-shared
  - nest-city-account
  - nest-clamav-scanner
  - nest-forms-backend
  - nest-tax-backend
  - openapi-clients
  - next
  - scripts
  - strapi
# `ssh2` (via `ssh2-sftp-client` in nest-tax-backend) compiles two optional
# native speedups — its own `sshcrypto` binding and `cpu-features`. Neither
# builds in the alpine images (no python3/g++) and both are `require`d inside a
# try/catch, so ssh2 silently falls back to Node's `crypto`. Skipping the builds
# keeps the images free of a compiler toolchain and makes local, CI and Docker
# installs behave the same.
allowBuilds:
  '@apollo/protobufjs': true
  '@openapitools/openapi-generator-cli': true
  # Pulled in by jest-haste-map 30.5. Its install script only compiles when a
  # source build is forced; the prebuilt binary comes from a per-platform
  # optional dependency.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js-pure: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@bratislava/*'

# @swc/core 1.16.x (1.16.12 and 1.16.13) can't load its native binding on Windows: the cache-root
# ACL check rejects ordinary profile directories, so i18next-cli (`parse-translations`) and the
# Strapi admin build crash on Windows dev machines. Fixed upstream in
# https://github.com/swc-project/swc/pull/12452 but not released yet. 1.15.43 is the version the
# NestJS CLI already uses. Scoped to the affected consumers: a bare `@swc/core` override makes pnpm
# re-resolve every package that depends on it, including the NestJS CLI's webpack.
# TODO: Drop these overrides once an @swc/core release includes that fix.
overrides:
  'i18next-cli>@swc/core': 1.15.43
  'i18next-resources-for-ts>@swc/core': 1.15.43
  '@vitejs/plugin-react-swc>@swc/core': 1.15.43
  # `@x0k/json-schema-merge` (used by @rjsf/utils to merge `allOf`) before 1.1.0
  # attached the `else` of a later `allOf` condition to an earlier `if` that has
  # none, so RJSF's `omitExtraData` kept data from inactive branches. @rjsf/utils
  # 6.11.0 still allows ^1.0.6, so this forces the fixed release.
  # TODO: Drop this override once @rjsf/utils requires ^1.1.0 itself.
  '@x0k/json-schema-merge': 1.1.0

# These packages import `typescript` without declaring it as a dependency or peer, so instead of
# the TypeScript of the project that uses them, they get whichever version pnpm happens to hoist,
# which can be another workspace package's (incompatible) TypeScript. Declaring the peer makes them
# resolve the using project's TypeScript.
packageExtensions:
  '@darraghor/eslint-plugin-nestjs-typed':
    peerDependencies:
      typescript: '*'
  eslint-plugin-import:
    peerDependencies:
      typescript: '*'
    peerDependenciesMeta:
      typescript:
        optional: true

# The root package.json pins Node and pnpm in devEngines with `onFail: error`,
# so any tool that reads that contract and finds the wrong version stops instead
# of running on a mismatch. That is the right default for a consumer that only
# checks the pin.
#
# When the toolchain is used through pnpm, though, the versions are managed by
# pnpm, so the two settings below relax that `error` to `download` for pnpm's own
# runs: when pnpm -- or a Node process pnpm starts -- needs a version that is not
# present, pnpm fetches the pinned one and uses it. Direct `node` stays Volta's
# job (volta.node), and a bare non-pnpm tool still hits the strict error.
#
# pmOnFail overrides devEngines.packageManager.onFail; runtimeOnFail overrides
# devEngines.runtime.onFail.
pmOnFail: download
runtimeOnFail: download
