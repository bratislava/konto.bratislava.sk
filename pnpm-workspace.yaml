# `ssh2` (via `ssh2-sftp-client` in nest-tax-backend) compiles two optional
# native speedups — its own `sshcrypto` binding and `cpu-features`. Neither
# builds in the alpine images (no python3/g++) and both are `require`d inside a
# try/catch, so ssh2 silently falls back to Node's `crypto`. Skipping the builds
# keeps the images free of a compiler toolchain and makes local, CI and Docker
# installs behave the same.
allowBuilds:
  '@apollo/protobufjs': true
  '@openapitools/openapi-generator-cli': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js-pure: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@bratislava/*'

# The root package.json pins Node and pnpm in devEngines with `onFail: error`,
# so any tool that reads that contract and finds the wrong version stops instead
# of running on a mismatch. That is the right default for a consumer that only
# checks the pin.
#
# When the toolchain is used through pnpm, though, the versions are managed by
# pnpm, so the two settings below relax that `error` to `download` for pnpm's own
# runs: when pnpm -- or a Node process pnpm starts -- needs a version that is not
# present, pnpm fetches the pinned one and uses it. Direct `node` stays Volta's
# job (volta.node), and a bare non-pnpm tool still hits the strict error.
#
# pmOnFail overrides devEngines.packageManager.onFail; runtimeOnFail overrides
# devEngines.runtime.onFail.
pmOnFail: download
runtimeOnFail: download
