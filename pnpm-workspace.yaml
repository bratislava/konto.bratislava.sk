  '@rjsf/core': 6.11.0
  '@rjsf/utils': 6.11.0
  '@rjsf/validator-ajv8': 6.11.0
  '@types/node': 24.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  ajv: 8.20.0
  ajv-errors: 3.0.0
  ajv-formats: 3.0.1
  axios: 1.18.1
