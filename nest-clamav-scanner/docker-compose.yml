services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
      PGPORT: 54302
    expose:
      - '54302'
    ports:
      - '127.0.0.1:54302:54302'
    networks:
      - konto

volumes:
  postgres:

networks:
  konto:
    name: konto-network
